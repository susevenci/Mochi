<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochi</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body class="booting">
    <div id="stage"></div>
    <!-- 模型加载失败时的静态立绘兜底（计划书 5.6.7）：情绪驱动 CSS 滤镜，绝不白屏 -->
    <img id="fallback-portrait" src="./fallback/portrait.png" alt="" hidden />

    <div id="chat-log" aria-live="polite"></div>
    <div id="asr-caption" hidden></div>
    <form id="chat-form" autocomplete="off">
      <input
        id="chat-input"
        type="text"
        placeholder="说点什么…（Enter 发送，Esc 打断）"
        maxlength="2000"
      />
      <button id="mic-button" type="button" title="按住说话（松开识别）" aria-label="按住说话">
        &#127908;
      </button>
      <button id="chat-send" type="submit">发送</button>
    </form>

    <button id="open-settings" type="button" title="LLM 配置" aria-label="LLM 配置">
      &#9881;
    </button>
    <button id="open-debug" type="button" title="情感与表现调试面板" aria-label="情感与表现调试面板">
      &#128296;
    </button>
    <div id="settings-root"></div>
    <div id="debug-root"></div>

    <div id="hud">
      <span id="status" data-state="connecting">connecting</span>
    </div>
    <script src="/vendor/live2dcubismcore.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
