[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi-server"
version = "0.3.0"
description = "Mochi desktop companion - Python backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pillow>=10.0",
    "types-PyYAML>=6.0",
]
# 语音链路（S4）：重依赖，惰性导入，CI 可不装
voice = [
    "numpy>=1.26",
    "edge-tts>=6.1",
    "faster-whisper>=1.0",
]
# 记忆与工具（S6）
memory = [
    "aiosqlite>=0.20",
    "APScheduler>=3.10",
    "tiktoken>=0.7",
]
# 打包（S5/S7）
packaging = [
    "pyinstaller>=6.6",
]

[tool.setuptools.packages.find]
where = ["server"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

# I5：业务层禁止直连 LLM SDK；app/providers/ 是唯一例外（见 per-file-ignores）
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"openai".msg = "I5: 请通过 app/providers/ 的 Provider 抽象调用 LLM"

[tool.ruff.lint.per-file-ignores]
"server/app/providers/*" = ["TID251"]
"server/app/gateway/protocol.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["server/app", "scripts"]
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["uvicorn.*", "pydantic_settings.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]
addopts = "-q"
